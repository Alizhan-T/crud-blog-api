<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD Blog API — Web Client</title>
    <style>
        :root {
            --bg: #0b1120;
            --card: #111827;
            --surface: #1e293b;
            --border: rgba(148, 163, 184, 0.16);
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #10b981;
            --accent-hover: #059669;
            --blue: #3b82f6;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 28px 16px 48px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at 15% 0%, rgba(16, 185, 129, 0.14), transparent 40%), var(--bg);
            color: var(--text);
        }
        .wrap { max-width: 820px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        h1 { margin: 0; font-size: 1.75rem; letter-spacing: -0.02em; }
        .badge {
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 600;
            color: #6ee7b7;
            background: rgba(16, 185, 129, 0.14);
            border: 1px solid rgba(16, 185, 129, 0.35);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
        }
        h2 { margin: 0 0 12px; font-size: 1.08rem; }
        input, textarea {
            width: 100%;
            margin: 6px 0;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font: inherit;
            font-size: 0.95rem;
        }
        textarea { min-height: 88px; resize: vertical; }
        input:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
        .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
        .row input { flex: 1; min-width: 160px; margin: 0; }
        button {
            border: 0;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            color: #fff;
            background: var(--accent);
        }
        button:hover { background: var(--accent-hover); }
        button.secondary { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
        button.edit { background: var(--blue); padding: 7px 12px; font-size: 0.82rem; }
        button.danger { background: rgba(239, 68, 68, 0.16); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.35); padding: 7px 12px; font-size: 0.82rem; }
        .status { margin-top: 10px; font-size: 0.88rem; min-height: 20px; color: #6ee7b7; }
        .status.error { color: #fca5a5; }
        .blog {
            border: 1px solid var(--border);
            background: rgba(30, 41, 59, 0.55);
            border-radius: 12px;
            padding: 16px;
            margin-top: 12px;
        }
        .blog h3 { margin: 0 0 6px; font-size: 1.08rem; }
        .blog p { margin: 0 0 10px; color: #cbd5e1; line-height: 1.5; white-space: pre-wrap; }
        .meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.82rem; color: var(--muted); }
        .actions { display: flex; gap: 8px; }
        .empty { color: var(--muted); font-size: 0.92rem; margin: 8px 0 0; }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <div>
            <h1>CRUD Blog API</h1>
            <div style="color:#94a3b8;font-size:0.9rem;margin-top:4px;">Express 5 + MongoDB (Mongoose) interactive client</div>
        </div>
        <span class="badge">REST · /blogs</span>
    </header>

    <section class="card">
        <h2 id="formHeading">Create Blog Post</h2>
        <form id="blogForm">
            <input id="title" placeholder="Title (min 2 characters)" required />
            <textarea id="body" placeholder="Body (min 5 characters)" required></textarea>
            <input id="author" placeholder="Author (optional, defaults to Anonymous)" />
            <div class="row">
                <button id="submitBtn" type="submit">Publish Post</button>
                <button id="cancelEditBtn" type="button" class="secondary" hidden>Cancel Edit</button>
            </div>
        </form>
        <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>

    <section class="card">
        <h2>Published Posts</h2>
        <form id="filterForm" class="row">
            <input id="searchQ" placeholder="Search title or body (?q=)" />
            <input id="searchAuthor" placeholder="Filter by author (?author=)" />
            <button type="submit" class="secondary">Filter</button>
            <button id="resetFilterBtn" type="button" class="secondary">Reset</button>
        </form>
        <div id="blogs"></div>
    </section>
</div>

<script>
    const API_URL = "/blogs";
    let editingId = null;

    const el = (id) => document.getElementById(id);

    function setStatus(message, isError = false) {
        const node = el("status");
        node.textContent = message || "";
        node.classList.toggle("error", Boolean(isError));
    }

    function resetForm() {
        editingId = null;
        el("title").value = "";
        el("body").value = "";
        el("author").value = "";
        el("formHeading").textContent = "Create Blog Post";
        el("submitBtn").textContent = "Publish Post";
        el("cancelEditBtn").hidden = true;
    }

    function startEdit(blog) {
        editingId = blog._id;
        el("title").value = blog.title || "";
        el("body").value = blog.body || "";
        el("author").value = blog.author || "";
        el("formHeading").textContent = "Edit Blog Post";
        el("submitBtn").textContent = "Save Changes";
        el("cancelEditBtn").hidden = false;
        el("title").focus();
        setStatus("Editing post...");
    }

    async function requestJSON(url, options = {}) {
        const res = await fetch(url, options);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
            throw new Error(data.message || `Request failed (HTTP ${res.status})`);
        }
        return data;
    }

    function renderBlogs(blogs) {
        const container = el("blogs");
        container.replaceChildren();

        if (!blogs.length) {
            const p = document.createElement("p");
            p.className = "empty";
            p.textContent = "No blog posts found.";
            container.appendChild(p);
            return;
        }

        blogs.forEach((blog) => {
            const article = document.createElement("article");
            article.className = "blog";

            const h3 = document.createElement("h3");
            h3.textContent = blog.title;

            const body = document.createElement("p");
            body.textContent = blog.body;

            const meta = document.createElement("div");
            meta.className = "meta";

            const info = document.createElement("span");
            const dateStr = blog.createdAt ? new Date(blog.createdAt).toLocaleString() : "";
            info.textContent = `By ${blog.author || "Anonymous"}${dateStr ? ` · ${dateStr}` : ""}`;

            const actions = document.createElement("div");
            actions.className = "actions";

            const editBtn = document.createElement("button");
            editBtn.type = "button";
            editBtn.className = "edit";
            editBtn.textContent = "Edit";
            editBtn.addEventListener("click", () => startEdit(blog));

            const delBtn = document.createElement("button");
            delBtn.type = "button";
            delBtn.className = "danger";
            delBtn.textContent = "Delete";
            delBtn.addEventListener("click", () => deleteBlog(blog._id));

            actions.append(editBtn, delBtn);
            meta.append(info, actions);
            article.append(h3, body, meta);
            container.appendChild(article);
        });
    }

    async function loadBlogs() {
        try {
            const params = new URLSearchParams();
            const q = el("searchQ").value.trim();
            const author = el("searchAuthor").value.trim();
            if (q) params.set("q", q);
            if (author) params.set("author", author);
            const url = params.toString() ? `${API_URL}?${params}` : API_URL;
            const blogs = await requestJSON(url);
            renderBlogs(blogs);
        } catch (err) {
            setStatus(err.message, true);
        }
    }

    async function deleteBlog(id) {
        try {
            await requestJSON(`${API_URL}/${encodeURIComponent(id)}`, { method: "DELETE" });
            if (editingId === id) resetForm();
            setStatus("Post deleted.");
            await loadBlogs();
        } catch (err) {
            setStatus(err.message, true);
        }
    }

    el("blogForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const payload = {
            title: el("title").value,
            body: el("body").value,
            author: el("author").value,
        };

        try {
            if (editingId) {
                await requestJSON(`${API_URL}/${encodeURIComponent(editingId)}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });
                setStatus("Post updated.");
            } else {
                await requestJSON(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });
                setStatus("Post published.");
            }
            resetForm();
            await loadBlogs();
        } catch (err) {
            setStatus(err.message, true);
        }
    });

    el("cancelEditBtn").addEventListener("click", () => {
        resetForm();
        setStatus("");
    });

    el("filterForm").addEventListener("submit", (e) => {
        e.preventDefault();
        loadBlogs();
    });

    el("resetFilterBtn").addEventListener("click", () => {
        el("searchQ").value = "";
        el("searchAuthor").value = "";
        loadBlogs();
    });

    loadBlogs();
</script>
</body>
</html>
