<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="CRUD Blog API — Express 5 and MongoDB REST Service">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070D19"/>
      <stop offset="55%" stop-color="#0D1627"/>
      <stop offset="100%" stop-color="#0C2925"/>
    </linearGradient>
    <radialGradient id="emeraldGlow" cx="82%" cy="32%" r="46%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="18%" cy="84%" r="42%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="55%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="20" fill="url(#emeraldGlow)"/>
  <rect width="1200" height="320" rx="20" fill="url(#blueGlow)"/>
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#topBar)"/>

  <!-- Pill Badge -->
  <g transform="translate(64, 52)">
    <rect x="0" y="0" width="292" height="30" rx="15" fill="#10202C" stroke="#10B981" stroke-opacity="0.45" stroke-width="1"/>
    <circle cx="16" cy="15" r="4.5" fill="#10B981"/>
    <text x="30" y="19.5" fill="#D1FAE5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.4">NODE.JS · EXPRESS 5 · MONGODB MVC</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="64" y="140" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="50" font-weight="800" letter-spacing="-1.2">CRUD Blog API</text>
  <text x="64" y="178" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18.5">Hardened RESTful Blog API with Mongoose validation, safe search &amp; web UI</text>

  <!-- Feature Pills -->
  <g transform="translate(64, 214)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600">
    <rect x="0" y="0" width="144" height="34" rx="10" fill="#111C2E" stroke="#334155"/>
    <text x="72" y="21.5" text-anchor="middle" fill="#34D399">POST/GET/PUT/DEL</text>

    <rect x="156" y="0" width="154" height="34" rx="10" fill="#111C2E" stroke="#334155"/>
    <text x="233" y="21.5" text-anchor="middle" fill="#60A5FA">ReDoS &amp; XSS Safe</text>

    <rect x="322" y="0" width="144" height="34" rx="10" fill="#111C2E" stroke="#334155"/>
    <text x="394" y="21.5" text-anchor="middle" fill="#FDBA74">Mongoose v9</text>

    <rect x="478" y="0" width="146" height="34" rx="10" fill="#111C2E" stroke="#334155"/>
    <text x="551" y="21.5" text-anchor="middle" fill="#86EFAC">0 Vulnerabilities</text>
  </g>

  <!-- Right-side REST Endpoints Panel -->
  <g transform="translate(794, 46)">
    <rect x="0" y="0" width="342" height="228" rx="18" fill="#0B1221" fill-opacity="0.92" stroke="#1E3A3A" stroke-width="1.2"/>
    <text x="22" y="34" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.8">REST ENDPOINTS · /BLOGS</text>

    <g transform="translate(22, 52)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <rect x="0" y="0" width="54" height="22" rx="6" fill="#064E3B"/><text x="27" y="15" text-anchor="middle" fill="#6EE7B7" font-weight="700">POST</text>
      <text x="66" y="15" fill="#E2E8F0">/blogs</text><text x="296" y="15" text-anchor="end" fill="#64748B">201</text>

      <rect x="0" y="32" width="54" height="22" rx="6" fill="#1E3A8A"/><text x="27" y="47" text-anchor="middle" fill="#93C5FD" font-weight="700">GET</text>
      <text x="66" y="47" fill="#E2E8F0">/blogs?q=&amp;author=</text><text x="296" y="47" text-anchor="end" fill="#64748B">200</text>

      <rect x="0" y="64" width="54" height="22" rx="6" fill="#1E3A8A"/><text x="27" y="79" text-anchor="middle" fill="#93C5FD" font-weight="700">GET</text>
      <text x="66" y="79" fill="#E2E8F0">/blogs/:id</text><text x="296" y="79" text-anchor="end" fill="#64748B">200</text>

      <rect x="0" y="96" width="54" height="22" rx="6" fill="#7C2D12"/><text x="27" y="111" text-anchor="middle" fill="#FDBA74" font-weight="700">PUT</text>
      <text x="66" y="111" fill="#E2E8F0">/blogs/:id</text><text x="296" y="111" text-anchor="end" fill="#64748B">200</text>

      <rect x="0" y="128" width="54" height="22" rx="6" fill="#7F1D1D"/><text x="27" y="143" text-anchor="middle" fill="#FCA5A5" font-weight="700">DEL</text>
      <text x="66" y="143" fill="#E2E8F0">/blogs/:id</text><text x="296" y="143" text-anchor="end" fill="#64748B">200</text>
    </g>
  </g>
</svg>
